name: manual-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Verify gofmt
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files '*.go')"
          test -n "${files}"
          unformatted="$(gofmt -l ${files})"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required for:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run test suite
        run: go test ./...

  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary_ext: ""
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
            binary_ext: ""
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary_ext: ""
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
            binary_ext: ""
          - goos: windows
            goarch: amd64
            archive_ext: zip
            binary_ext: .exe
          - goos: windows
            goarch: arm64
            archive_ext: zip
            binary_ext: .exe

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build speckeep
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          output="dist/speckeep${{ matrix.binary_ext }}"
          go build -trimpath -ldflags "-X speckeep/src/internal/cli.Version=${{ inputs.tag }}" -o "${output}" ./src/cmd/speckeep

      - name: Package tar archive
        if: matrix.goos != 'windows'
        run: |
          asset="speckeep_${{ inputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -C dist -czf "dist/${asset}" "speckeep"

      - name: Package Windows archive
        if: matrix.goos == 'windows'
        run: |
          asset="speckeep_${{ inputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          cd dist
          zip "${asset}" "speckeep.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: speckeep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/speckeep_${{ inputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;

      - name: Generate sha256sum.txt
        run: |
          cd release-assets
          ls -1 | sort | xargs -I{} sha256sum "{}" > sha256sum.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release-assets/*
          generate_release_notes: true

  npm-publish:
    runs-on: ubuntu-latest
    needs: release
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Check out tagged source
        if: env.NPM_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync package version to tag
        if: env.NPM_TOKEN != ''
        working-directory: contrib/packaging/npm
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          npm pkg set version="${tag#v}"

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: contrib/packaging/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skipped (no NPM_TOKEN)
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret not set — skipping npm publish. Add it in repo settings to enable."

  publish-packages:
    runs-on: ubuntu-latest
    needs: release
    env:
      PKG_PUSH_TOKEN: ${{ secrets.PKG_PUSH_TOKEN }}

    steps:
      - name: Check out tagged source
        if: env.PKG_PUSH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Compute source tarball sha256
        if: env.PKG_PUSH_TOKEN != ''
        id: source
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          sha="$(curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz" | sha256sum | awk '{print $1}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Fetch Windows asset hashes
        if: env.PKG_PUSH_TOKEN != ''
        id: windows
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          curl -fsSL -o sha256sum.txt "https://github.com/${{ github.repository }}/releases/download/${tag}/sha256sum.txt"
          amd64="$(awk '/speckeep_.*_windows_amd64\.zip$/{print $1}' sha256sum.txt)"
          arm64="$(awk '/speckeep_.*_windows_arm64\.zip$/{print $1}' sha256sum.txt)"
          test -n "${amd64}" && test -n "${arm64}"
          echo "amd64=${amd64}" >> "$GITHUB_OUTPUT"
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        if: env.PKG_PUSH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: bzdvdn/homebrew-speckeep
          token: ${{ secrets.PKG_PUSH_TOKEN }}
          path: tap

      - name: Update Homebrew formula
        if: env.PKG_PUSH_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 contrib/packaging/update-release.py formula tap/Formula/speckeep.rb "${VERSION#v}" "${SOURCE_SHA}"

      - name: Push Homebrew tap
        if: env.PKG_PUSH_TOKEN != ''
        working-directory: tap
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "speckeep-release-bot"
          git config user.email "release@users.noreply.github.com"
          git commit -am "speckeep ${{ inputs.tag }}"
          git push

      - name: Check out Scoop bucket
        if: env.PKG_PUSH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: bzdvdn/scoop-speckeep
          token: ${{ secrets.PKG_PUSH_TOKEN }}
          path: scoop

      - name: Update Scoop manifest
        if: env.PKG_PUSH_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ inputs.tag }}
          AMD64_SHA: ${{ steps.windows.outputs.amd64 }}
          ARM64_SHA: ${{ steps.windows.outputs.arm64 }}
        run: |
          set -euo pipefail
          python3 contrib/packaging/update-release.py scoop scoop/bucket/speckeep.json "${VERSION#v}" "${AMD64_SHA}" "${ARM64_SHA}"

      - name: Push Scoop bucket
        if: env.PKG_PUSH_TOKEN != ''
        working-directory: scoop
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "manifest already up to date"
            exit 0
          fi
          git config user.name "speckeep-release-bot"
          git config user.email "release@users.noreply.github.com"
          git commit -am "speckeep ${{ inputs.tag }}"
          git push

      - name: Skipped (no PKG_PUSH_TOKEN)
        if: env.PKG_PUSH_TOKEN == ''
        run: echo "PKG_PUSH_TOKEN secret not set — skipping Homebrew tap / Scoop bucket update. Add a token with contents:write on bzdvdn/homebrew-speckeep and bzdvdn/scoop-speckeep to enable."
